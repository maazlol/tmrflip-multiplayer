<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tmrflip – Lobby</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0c; color: #f0f0f0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 32px 16px;
    }
    .logo { font-size: 2.2rem; color: #ffe24a; letter-spacing: 4px; margin-bottom: 4px; }
    .sub  { font-size: 0.8em; color: #555; letter-spacing: 2px; margin-bottom: 28px; }
    .panel {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 22px; width: 100%; max-width: 460px; margin-bottom: 14px;
    }
    .panel-title { font-size: 0.72em; color: #666; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
    #code-box {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.06); border: 1.5px dashed rgba(255,255,255,0.2);
      border-radius: 10px; padding: 12px 16px; font-size: 1.3em; font-weight: bold;
      letter-spacing: 3px; color: #ffe24a; cursor: pointer; transition: background 0.15s;
    }
    #code-box:hover { background: rgba(255,226,74,0.08); }
    #copy-hint { font-size: 0.5em; color: #666; letter-spacing: 1px; margin-left: auto; }
    #player-list { display: flex; flex-direction: column; gap: 8px; }
    .player-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: rgba(255,255,255,0.04); border-radius: 8px; font-size: 0.9em;
    }
    .pip { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; flex-shrink: 0; }
    .badge {
      margin-left: auto; font-size: 0.7em; color: #ffe24a;
      border: 1px solid rgba(255,226,74,0.3); border-radius: 4px; padding: 2px 6px;
    }
    #start-btn {
      width: 100%; padding: 14px; font-size: 1rem; font-family: inherit; font-weight: bold;
      background: #ffe24a; color: #111; border: none; border-radius: 10px;
      cursor: pointer; margin-top: 12px; display: none; transition: background 0.15s;
    }
    #start-btn:hover { background: #fff; }
    #waiting-text { color: #555; font-size: 0.85em; margin-top: 10px; text-align: center; }
    #chat-messages {
      height: 150px; overflow-y: auto; font-size: 0.82em; line-height: 1.6; margin-bottom: 10px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .chat-row { margin-bottom: 2px; }
    .chat-row b { color: #ffe24a; }
    .chat-row.sys { color: #555; font-style: italic; }
    .chat-row.sys b { color: #555; }
    #chat-input-row { display: flex; gap: 8px; }
    #chat-input {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: #f0f0f0; font-family: inherit;
      font-size: 0.85em; padding: 8px 12px; outline: none;
    }
    #chat-input:focus { border-color: rgba(255,226,74,0.4); }
    #chat-send {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; color: #f0f0f0; font-family: inherit;
      font-size: 0.85em; padding: 8px 14px; cursor: pointer;
    }
    #name-entry { display: none; width: 100%; max-width: 440px; text-align: center; }
    #name-entry input {
      width: 100%; padding: 13px 16px; font-size: 1rem; font-family: inherit;
      background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: #f0f0f0; outline: none; margin-bottom: 12px;
    }
    #name-entry input:focus { border-color: #ffe24a; }
    #name-entry button {
      width: 100%; padding: 13px; font-family: inherit; font-size: 1rem; font-weight: bold;
      background: #ffe24a; color: #111; border: none; border-radius: 10px; cursor: pointer;
    }
    #name-entry h2 { margin-bottom: 18px; color: #ffe24a; }
    .discord-link { position: fixed; bottom: 16px; right: 16px; opacity: 0.35; transition: opacity 0.2s; }
    .discord-link:hover { opacity: 0.8; }
    .discord-link img { width: 30px; filter: grayscale(1) brightness(2); }
  </style>
</head>
<body>
<div class="logo">tmrflip</div>
<div class="sub">LOBBY</div>

<div id="name-entry">
  <h2>Enter Your Name</h2>
  <input type="text" id="name-fallback-input" placeholder="Your name" maxlength="20">
  <button onclick="submitName()">Join Room</button>
</div>

<div id="main-content" style="display:none;width:100%;flex-direction:column;align-items:center;">
  <div class="panel">
    <div class="panel-title">Share this code</div>
    <div id="code-box" onclick="copyLink()">
      <span id="code-display">---</span>
      <span id="copy-hint">Click to copy link</span>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title">Players</div>
    <div id="player-list"></div>
    <button id="start-btn" onclick="startGame()">Start Game →</button>
    <div id="waiting-text">Waiting for host to start…</div>
  </div>
  <div class="panel">
    <div class="panel-title">Chat</div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input type="text" id="chat-input" placeholder="Type a message…" autocomplete="off">
      <button id="chat-send">→</button>
    </div>
  </div>
</div>

<a class="discord-link" href="https://discord.gg/znceQfMRUT" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord">
</a>

<script src="/socket.io/socket.io.js"></script>
<script>
  let code, name, socket, isHost;

  window.onload = () => {
    const p = new URLSearchParams(window.location.search);
    code   = p.get('code');
    name   = p.get('name');
    isHost = !p.get('joined');
    if (!code) { alert('No game code!'); window.location.href = '/index.html'; return; }
    document.getElementById('code-display').textContent = code;
    if (!name || !name.trim()) {
      document.getElementById('name-entry').style.display = 'block';
    } else {
      initLobby();
    }
  };

  function submitName() {
    const v = document.getElementById('name-fallback-input').value.trim();
    if (!v) return;
    name = v;
    history.replaceState({}, '', `?code=${code}&name=${encodeURIComponent(name)}&joined=true`);
    document.getElementById('name-entry').style.display = 'none';
    initLobby();
  }

  function initLobby() {
    const mc = document.getElementById('main-content');
    mc.style.display = 'flex';
    mc.style.flexDirection = 'column';
    mc.style.alignItems = 'center';
    socket = io();
    socket.emit('join-game', { name, code, isHost });
    socket.on('name-taken', () => {
      alert('Name already taken.'); window.location.href = `/waiting.html?code=${code}&joined=true`;
    });
    socket.on('player-list', players => renderPlayers(players));
    socket.on('chat-message', ({ name: n, message }) => addChat(n, message));
    socket.on('deal-hand', () => {
      window.location.href = `/game.html?code=${code}&name=${encodeURIComponent(name)}`;
    });
    document.getElementById('chat-send').addEventListener('click', sendChat);
    document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
  }

  function renderPlayers(players) {
    const host = players[0];
    document.getElementById('player-list').innerHTML = players.map((p, i) =>
      `<div class="player-row"><div class="pip"></div><span>${p}</span>
      ${i===0?'<span class="badge">HOST</span>':''}
      ${p===name?'<span class="badge" style="border-color:rgba(255,255,255,0.15);color:#666">YOU</span>':''}</div>`
    ).join('');
    const btn = document.getElementById('start-btn');
    const txt = document.getElementById('waiting-text');
    if (name === host && players.length >= 2) { btn.style.display='block'; txt.style.display='none'; }
    else if (name === host) { btn.style.display='none'; txt.textContent='Need at least 2 players.'; }
    else { btn.style.display='none'; txt.textContent='Waiting for host to start…'; }
  }

  function startGame() { socket.emit('start-game', { code, name }); }

  function addChat(n, message) {
    const div = document.createElement('div');
    div.className = 'chat-row' + (n==='System'?' sys':'');
    div.innerHTML = `<b>${n}:</b> ${message}`;
    const box = document.getElementById('chat-messages');
    box.appendChild(div); box.scrollTop = box.scrollHeight;
  }

  function sendChat() {
    const inp = document.getElementById('chat-input');
    const msg = inp.value.trim(); if (!msg) return;
    socket.emit('chat-message', { code, name, message: msg }); inp.value = '';
  }

  function copyLink() {
    const link = `${location.origin}/waiting.html?code=${code}&joined=true`;
    navigator.clipboard.writeText(link).then(() => {
      document.getElementById('copy-hint').textContent = '✓ Copied!';
      setTimeout(() => document.getElementById('copy-hint').textContent = 'Click to copy link', 2000);
    });
  }
</script>
</body>
</html>
