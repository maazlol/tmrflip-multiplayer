<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tmrflip – Game</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>

<!-- ── STATUS BAR ───────────────────────────── -->
<div id="status-bar">
  <span id="game-title">tmrflip</span>
  <span id="turn-indicator">Waiting for game…</span>
  <span id="colorlock-badge"></span>
  <button class="bar-btn" id="tmr-btn" disabled title="Call TMR when you have 1 card left!">🃏 TMR!</button>
</div>

<!-- ── GAME LAYOUT ─────────────────────────── -->
<div id="game-layout">

  <!-- TOP OPPONENTS -->
  <div id="opponents-top"></div>

  <!-- MIDDLE ROW -->
  <div id="middle-row">
    <div id="opp-left" class="opp-side" style="visibility:hidden"></div>

    <!-- CENTER TABLE (deck + discard) -->
    <div id="center-table">
      <div class="pile-wrap">
        <div id="deck-card" class="card card-back" title="Click to draw a card"></div>
        <div class="pile-label">Draw</div>
      </div>
      <div class="pile-wrap">
        <div id="discard-card" class="card" style="background:#222"></div>
        <div class="pile-label">Discard</div>
      </div>
    </div>

    <div id="opp-right" class="opp-side" style="visibility:hidden"></div>
  </div>

  <!-- MY HAND -->
  <div id="hand-area">
    <div id="my-name-label"></div>
    <div id="my-hand"></div>
    <div id="hand-actions">
      <button class="action-btn primary" id="draw-btn" disabled>Draw Card</button>
      <div id="pass-btn-wrap">
        <button class="action-btn" id="pass-btn">Pass Turn</button>
      </div>
    </div>
  </div>
</div>

<!-- ── CHAT ─────────────────────────────────── -->
<div id="chat-panel">
  <div id="chat-header"><span>💬 Chat</span><span id="chat-toggle">▼</span></div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Say something…" autocomplete="off">
    <button id="chat-send">→</button>
  </div>
</div>
<div id="chat-minimized">💬 Chat ▲</div>

<!-- ── COLOR PICKER MODAL ────────────────────── -->
<div id="color-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Choose a Color</h3>
    <div id="color-picker-btns">
      <button class="color-pick-btn" data-c="Red">Red</button>
      <button class="color-pick-btn" data-c="Blue">Blue</button>
      <button class="color-pick-btn" data-c="Green">Green</button>
      <button class="color-pick-btn" data-c="Yellow">Yellow</button>
    </div>
  </div>
</div>

<!-- ── TARGET PICKER MODAL ───────────────────── -->
<div id="target-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="target-modal-title">Choose a Player</h3>
    <div id="target-btns"></div>
  </div>
</div>

<!-- ── PEEK RESULT MODAL ─────────────────────── -->
<div id="peek-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="peek-modal-title">Their Hand</h3>
    <div id="peek-cards"></div>
    <button class="modal-close-btn" onclick="document.getElementById('peek-modal').classList.add('hidden')">Close</button>
  </div>
</div>

<!-- ── WIN OVERLAY ───────────────────────────── -->
<div id="win-overlay" class="hidden">
  <canvas id="confetti-canvas"></canvas>
  <div id="win-text"></div>
  <button class="action-btn primary" onclick="window.location.href='/index.html'" style="margin-top:10px">Play Again</button>
</div>

<!-- ── NOTIFICATION ──────────────────────────── -->
<div id="notif"></div>

<!-- ── TMR ALERT BADGE ───────────────────────── -->
<div id="tmr-alert-badge" title="Catch them before they play next!"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ══════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════
const urlParams = new URLSearchParams(window.location.search);
const code   = urlParams.get('code');
const myName = urlParams.get('name');

if (!code || !myName) {
  alert('Missing game info. Redirecting…');
  window.location.href = '/index.html';
}

const socket = io({ query: { code } });

let myHand      = [];
let allPlayers  = [];
let handCounts  = [];
let currentPlayer = '';
let isMyTurn    = false;
let gameStarted = false;
let drawnCardPending = null; // card we just drew that we can optionally play

// ══════════════════════════════════════════════
// Card building
// ══════════════════════════════════════════════
const SPECIAL_META = {
  bomb:          { icon:'💣', label:'BOMB'     },
  swap:          { icon:'🔄', label:'SWAP'     },
  peek:          { icon:'👀', label:'PEEK'     },
  steal:         { icon:'🕵️', label:'STEAL'   },
  skipall:       { icon:'⏭️', label:'SKIP ALL' },
  colorlock:     { icon:'🔒', label:'CLR LOCK' },
  reverseattack: { icon:'↺+2', label:'REVERSE+'},
};

function valDisplay(v) {
  if (v === 'Skip')    return '⊘';
  if (v === 'Reverse') return '⇄';
  if (v === 'Wild')    return '🃏';
  return v;
}

function buildCard(card, opts = {}) {
  const el = document.createElement('div');
  el.className = 'card';

  if (opts.back || !card) {
    el.classList.add('card-back');
    if (opts.small) el.classList.add('card-sm');
    return el;
  }

  if (opts.small) el.classList.add('card-sm');

  if (card.type === 'Special') {
    el.classList.add('card-special');
    const m = SPECIAL_META[card.special] || { icon:'?', label:card.special };
    if (!opts.small) {
      el.innerHTML = `
        <div class="card-corner tl">${m.icon}</div>
        <div class="card-oval">${m.icon}</div>
        <div class="card-special-label">${m.label}</div>
        <div class="card-corner br">${m.icon}</div>`;
    } else {
      el.innerHTML = `<div style="font-size:1.1em">${m.icon}</div>`;
    }
  } else {
    const color = card.color === 'Wild' && card.wildCard ? card.color : card.color;
    el.dataset.color = color;
    const v = valDisplay(card.value);
    if (!opts.small) {
      el.innerHTML = `
        <div class="card-corner tl">${v}</div>
        <div class="card-oval">${v}</div>
        <div class="card-corner br">${v}</div>`;
    } else {
      el.style.fontSize = '0.6em';
    }
  }

  return el;
}

// ══════════════════════════════════════════════
// Render my hand
// ══════════════════════════════════════════════
function renderHand(hand) {
  myHand = hand;
  const container = document.getElementById('my-hand');
  container.innerHTML = '';

  hand.forEach((card, i) => {
    const el = buildCard(card);
    el.style.animationDelay = `${i * 0.03}s`;
    el.classList.add('card-anim-in');
    if (drawnCardPending && cardMatches(card, drawnCardPending)) {
      el.classList.add('just-drawn');
    }
    if (isMyTurn) {
      el.addEventListener('click', () => handleCardClick(card, el));
    }
    container.appendChild(el);
  });

  updateHandState();
}

function cardMatches(a, b) {
  if (!a || !b) return false;
  if (a.type === 'Special') return a.special === b.special;
  return a.color === b.color && a.value === b.value;
}

// ══════════════════════════════════════════════
// Play card flow
// ══════════════════════════════════════════════
function handleCardClick(card, el) {
  if (!isMyTurn) return;

  if (card.type === 'Special' && card.special === 'colorlock') {
    showColorPicker(color => {
      socket.emit('playCard', { ...card, chosenColor: color });
      clearDrawnPending();
    });
    return;
  }

  if (card.color === 'Wild') {
    showColorPicker(color => {
      socket.emit('playCard', { ...card, chosenColor: color });
      clearDrawnPending();
    });
    return;
  }

  socket.emit('playCard', card);
  clearDrawnPending();
}

function clearDrawnPending() {
  drawnCardPending = null;
  document.getElementById('pass-btn-wrap').classList.remove('visible');
}

// ══════════════════════════════════════════════
// Render top card (discard pile)
// ══════════════════════════════════════════════
function renderTopCard(card) {
  const el = document.getElementById('discard-card');
  if (!card) { el.style.background = '#222'; el.innerHTML = ''; return; }

  // Rebuild element to reset animations
  const newEl = buildCard(card);
  newEl.id = 'discard-card';
  newEl.style.setProperty('--card-w', '90px');
  newEl.style.setProperty('--card-h', '130px');
  newEl.style.borderRadius = '12px';
  newEl.classList.add('discard-pop');
  el.replaceWith(newEl);
}

// ══════════════════════════════════════════════
// Render opponents
// ══════════════════════════════════════════════
function getSlots(rotPlayers, rotCounts, rotCurrentPlayer) {
  // rotPlayers[0] = me
  const slots = { top: null, left: null, right: null };
  const n = rotPlayers.length;

  if (n === 2) {
    slots.top = { name: rotPlayers[1], count: rotCounts[1], active: rotPlayers[1] === rotCurrentPlayer };
  } else if (n === 3) {
    slots.right = { name: rotPlayers[1], count: rotCounts[1], active: rotPlayers[1] === rotCurrentPlayer };
    slots.top   = { name: rotPlayers[2], count: rotCounts[2], active: rotPlayers[2] === rotCurrentPlayer };
  } else if (n >= 4) {
    slots.right = { name: rotPlayers[1], count: rotCounts[1], active: rotPlayers[1] === rotCurrentPlayer };
    slots.top   = { name: rotPlayers[2], count: rotCounts[2], active: rotPlayers[2] === rotCurrentPlayer };
    slots.left  = { name: rotPlayers[3], count: rotCounts[3], active: rotPlayers[3] === rotCurrentPlayer };
  }
  return slots;
}

function buildOpponentTop(slot) {
  const div = document.createElement('div');
  div.className = 'opponent-slot' + (slot.active ? ' active-player-glow' : '');
  const cards = [...Array(Math.min(slot.count, 12))].map(() => buildCard(null, { back:true, small:true })).map(c => c.outerHTML).join('');
  div.innerHTML = `
    <div class="opp-name ${slot.active ? 'active' : ''}">${slot.name}</div>
    <div class="opp-cards">${cards}</div>
    <div class="opp-count-badge">${slot.count} card${slot.count !== 1 ? 's' : ''}</div>`;
  return div;
}

function buildOpponentSide(slot, tmrCallback) {
  const div = document.createElement('div');
  const count = Math.min(slot.count, 8);
  div.innerHTML = `
    <div class="opp-name ${slot.active ? 'active' : ''}">${slot.name}</div>
    <div class="opp-cards">${[...Array(count)].map(() => buildCard(null, { back:true, small:true })).map(c => c.outerHTML).join('')}</div>
    <div class="opp-count-badge">${slot.count} card${slot.count !== 1 ? 's' : ''}</div>`;
  if (slot.count === 1) {
    const catchBtn = document.createElement('button');
    catchBtn.className = 'action-btn';
    catchBtn.style.cssText = 'font-size:0.7em;padding:4px 8px;margin-top:4px;';
    catchBtn.textContent = '🚨 Catch!';
    catchBtn.onclick = () => { socket.emit('catchTMR', slot.name); };
    div.appendChild(catchBtn);
  }
  return div;
}

function renderOpponents(players, counts, cur) {
  const myIdx = players.indexOf(myName);
  if (myIdx === -1) return;

  const rotP = [...players.slice(myIdx), ...players.slice(0, myIdx)];
  const rotC = [...counts.slice(myIdx),  ...counts.slice(0, myIdx)];
  const slots = getSlots(rotP, rotC, cur);

  // Top
  const topContainer = document.getElementById('opponents-top');
  topContainer.innerHTML = '';
  if (slots.top) topContainer.appendChild(buildOpponentTop(slots.top));

  // Left
  const leftEl = document.getElementById('opp-left');
  if (slots.left) {
    leftEl.style.visibility = 'visible';
    leftEl.innerHTML = '';
    leftEl.appendChild(buildOpponentSide(slots.left));
  } else {
    leftEl.style.visibility = 'hidden';
    leftEl.innerHTML = '';
  }

  // Right
  const rightEl = document.getElementById('opp-right');
  if (slots.right) {
    rightEl.style.visibility = 'visible';
    rightEl.innerHTML = '';
    rightEl.appendChild(buildOpponentSide(slots.right));
  } else {
    rightEl.style.visibility = 'hidden';
    rightEl.innerHTML = '';
  }
}

// ══════════════════════════════════════════════
// Turn state
// ══════════════════════════════════════════════
function setTurn(yes) {
  isMyTurn = yes;
  updateHandState();
  const indicator = document.getElementById('turn-indicator');
  if (yes) {
    indicator.textContent = '⭐ Your turn!';
    indicator.className = 'my-turn';
  } else {
    indicator.textContent = currentPlayer ? `${currentPlayer}'s turn` : '';
    indicator.className = '';
  }
  document.getElementById('draw-btn').disabled = !yes;
  document.getElementById('tmr-btn').disabled = !(myHand.length === 1);
}

function updateHandState() {
  const hand = document.getElementById('my-hand');
  if (isMyTurn) {
    hand.classList.add('my-turn');
  } else {
    hand.classList.remove('my-turn');
  }
}

// ══════════════════════════════════════════════
// Color picker
// ══════════════════════════════════════════════
function showColorPicker(callback) {
  const modal = document.getElementById('color-modal');
  modal.classList.remove('hidden');
  const btns = modal.querySelectorAll('.color-pick-btn');
  btns.forEach(btn => {
    const handler = () => {
      modal.classList.add('hidden');
      btns.forEach(b => b.removeEventListener('click', b._handler));
      callback(btn.dataset.c);
    };
    btn._handler = handler;
    btn.addEventListener('click', handler);
  });
}

// ══════════════════════════════════════════════
// Target picker
// ══════════════════════════════════════════════
const TARGET_TITLES = {
  swap:  '🔄 Swap hands with…',
  peek:  '👀 Peek at whose hand?',
  steal: '🕵️ Steal a card from…',
};

function showTargetPicker(type, players) {
  const modal    = document.getElementById('target-modal');
  const btnsDiv  = document.getElementById('target-btns');
  document.getElementById('target-modal-title').textContent = TARGET_TITLES[type] || 'Choose a Player';
  btnsDiv.innerHTML = '';
  modal.classList.remove('hidden');

  players.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'target-btn';
    btn.textContent = name;
    btn.addEventListener('click', () => {
      modal.classList.add('hidden');
      socket.emit('actionResponse', { target: name });
    });
    btnsDiv.appendChild(btn);
  });
}

// ══════════════════════════════════════════════
// Notification
// ══════════════════════════════════════════════
let notifTimer;
function showNotif(msg, type = 'info') {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.className = '', 3000);
}

// ══════════════════════════════════════════════
// TMR Alert
// ══════════════════════════════════════════════
let tmrAlertTimer;
function showTMRAlert(name) {
  const badge = document.getElementById('tmr-alert-badge');
  badge.textContent = `🃏 ${name} has 1 card! Catch?`;
  badge.classList.add('visible');
  badge.onclick = () => { socket.emit('catchTMR', name); badge.classList.remove('visible'); };
  clearTimeout(tmrAlertTimer);
  tmrAlertTimer = setTimeout(() => badge.classList.remove('visible'), 5000);
}

// ══════════════════════════════════════════════
// Win / Confetti
// ══════════════════════════════════════════════
function showWinner(winner) {
  const overlay = document.getElementById('win-overlay');
  overlay.classList.remove('hidden');
  document.getElementById('win-text').textContent =
    winner === myName ? '🏆 You Won!' : `${winner} won!`;
  runConfetti();
}

function runConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const pts = [];
  const cols = ['#ffe24a','#ff5252','#64b5f6','#66bb6a','#ffffff','#ff8c00'];
  for (let i = 0; i < 120; i++) {
    pts.push({ x: canvas.width/2, y: canvas.height/2,
      vx: (Math.random()-0.5)*14, vy: -(Math.random()*12+4),
      ay: 0.28+Math.random()*0.14, r: 4+Math.random()*5,
      color: cols[Math.floor(Math.random()*cols.length)] });
  }
  let t = 0;
  (function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.color; ctx.fill();
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.ay;
    });
    if (++t < 90) requestAnimationFrame(draw);
  })();
}

// ══════════════════════════════════════════════
// Chat
// ══════════════════════════════════════════════
function addChat(name, message) {
  const msgs = document.getElementById('chat-messages');
  const div  = document.createElement('div');
  div.className = 'chat-msg' + (name === 'System' ? ' system' : '');
  div.innerHTML = `<b>${name}:</b> ${message}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendChat();
});
function sendChat() {
  const inp = document.getElementById('chat-input');
  const msg = inp.value.trim();
  if (!msg) return;
  socket.emit('chat-message', { code, name: myName, message: msg });
  inp.value = '';
}

// Chat minimize
document.getElementById('chat-header').addEventListener('click', () => {
  document.getElementById('chat-panel').style.display = 'none';
  document.getElementById('chat-minimized').style.display = 'block';
  document.getElementById('chat-toggle').textContent = '▲';
});
document.getElementById('chat-minimized').addEventListener('click', () => {
  document.getElementById('chat-panel').style.display = 'flex';
  document.getElementById('chat-minimized').style.display = 'none';
});

// ══════════════════════════════════════════════
// Draw / Pass buttons
// ══════════════════════════════════════════════
document.getElementById('draw-btn').addEventListener('click', () => {
  if (!isMyTurn || !gameStarted) return;
  socket.emit('drawCard');
});

document.getElementById('pass-btn').addEventListener('click', () => {
  if (!isMyTurn) return;
  socket.emit('passAfterDraw');
  clearDrawnPending();
});

// TMR button
document.getElementById('tmr-btn').addEventListener('click', () => {
  socket.emit('callTMR');
  showNotif('🃏 TMR called!', 'info');
});

// Deck click also draws
document.getElementById('deck-card').addEventListener('click', () => {
  if (!isMyTurn || !gameStarted) return;
  socket.emit('drawCard');
});

// ══════════════════════════════════════════════
// Socket events
// ══════════════════════════════════════════════
socket.on('connect', () => {
  socket.emit('joinGame', { name: myName, code });
  document.getElementById('my-name-label').textContent = myName;
});

socket.on('joinFailed', msg => {
  alert(msg);
  window.location.href = '/index.html';
});

socket.on('updateHand', hand => {
  renderHand(hand);
  document.getElementById('tmr-btn').disabled = !(hand.length === 1 && isMyTurn);
});

socket.on('updateTopCard', card => {
  renderTopCard(card);
});

socket.on('updatePlayers', ({ players, handCounts: counts, currentPlayer: cur }) => {
  allPlayers    = players;
  handCounts    = counts;
  currentPlayer = cur;
  renderOpponents(players, counts, cur);
  if (cur !== myName) {
    document.getElementById('turn-indicator').textContent = `${cur}'s turn`;
  }
});

socket.on('yourTurn', yes => {
  setTurn(yes);
  if (yes) showNotif('⭐ Your turn!', 'info');
});

socket.on('invalidMove', msg => {
  showNotif(msg, 'error');
  const hand = document.getElementById('my-hand');
  hand.classList.add('shake');
  setTimeout(() => hand.classList.remove('shake'), 400);
});

socket.on('canPlayDrawnCard', card => {
  drawnCardPending = card;
  document.getElementById('pass-btn-wrap').classList.add('visible');
  showNotif('You can play the drawn card, or pass.', 'info');
  // Re-render so the drawn card is highlighted
  renderHand(myHand);
});

socket.on('chooseTarget', ({ type, players }) => {
  showTargetPicker(type, players);
});

socket.on('peekResult', ({ name, hand }) => {
  const modal = document.getElementById('peek-modal');
  document.getElementById('peek-modal-title').textContent = `👀 ${name}'s Hand`;
  const container = document.getElementById('peek-cards');
  container.innerHTML = '';
  hand.forEach(c => container.appendChild(buildCard(c)));
  modal.classList.remove('hidden');
});

socket.on('tmr-alert', ({ name }) => {
  if (name !== myName) showTMRAlert(name);
  else showNotif('🃏 Call TMR before someone catches you!', 'info');
});

socket.on('special-anim', ({ type, target, color }) => {
  const labels = {
    bomb: `💣 Bombed ${target}!`, swap: `🔄 Swapped with ${target}!`,
    peek: `👀 Peeked at ${target}!`, steal: `🕵️ Stole from ${target}!`,
    skipall: '⏭️ Everyone skipped!', colorlock: `🔒 Color Lock: ${color}!`,
    reverseattack: `↺ Reversed! ${target} draws 2!`,
  };
  showNotif(labels[type] || type, 'info');
});

socket.on('chat-message', ({ name, message }) => addChat(name, message));

socket.on('gameOver', ({ winner }) => showWinner(winner));

// Color lock badge
socket.on('chat-message', ({ name, message }) => {
  // Detect colorlock messages for badge update
  if (name === 'System' && message.includes('Color Lock:')) {
    const match = message.match(/Color Lock: (\w+)/);
    if (match) showColorLockBadge(match[1]);
  }
  if (name === 'System' && message.includes('Color Lock expired')) {
    hideColorLockBadge();
  }
});

function showColorLockBadge(color) {
  const badge = document.getElementById('colorlock-badge');
  badge.textContent = `🔒 ${color} only`;
  badge.style.display = 'inline-block';
  badge.style.borderColor = color.toLowerCase();
  badge.style.color = color === 'Yellow' ? '#f9a825' : color.toLowerCase();
}
function hideColorLockBadge() {
  document.getElementById('colorlock-badge').style.display = 'none';
}

// Keyboard shortcut: D = draw, T = TMR
document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'd' || e.key === 'D') document.getElementById('draw-btn').click();
  if (e.key === 't' || e.key === 'T') document.getElementById('tmr-btn').click();
});

window.addEventListener('resize', () => {
  const c = document.getElementById('confetti-canvas');
  c.width = window.innerWidth; c.height = window.innerHeight;
});
</script>
</body>
</html>
